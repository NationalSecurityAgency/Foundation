name: Build image template
on:
  workflow_call:
    inputs:
      dockerfile:
        type: string
        required: true

jobs:
  build-layer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to ghcr.io
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push to branch
        uses: docker/build-push-action@v7
        if: github.ref_name != 'main'
        with:
          context: .
          push: true
          file: .github/dockerfiles/${{ inputs.dockerfile }}.Dockerfile
          tags: ghcr.io/nationalsecurityagency/foundation/${{ inputs.dockerfile }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
      - name: Build and push to main
        uses: docker/build-push-action@v7
        if: github.ref_name == 'main'
        with:
          context: .
          push: true
          file: .github/dockerfiles/${{ inputs.dockerfile }}.Dockerfile
          tags: ghcr.io/nationalsecurityagency/foundation/${{ inputs.dockerfile }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min