name: Build foundation container template

on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true

jobs:
  build-foundation-saw-container:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nationalsecurityagency/foundation/cargo-saw-build:latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Build Rust artifacts for SAW
        run: .ci/build-rust-saw-artifacts.sh
      - name: Tar all `.cry`, `.saw`, `linked-mir.json`, and `saw.py` files
        run: find . -name "*.cry" -or -name "*.saw" -or -name "linked-mir.json" -or -name "saw.py" -or -name "*.sh" | tar -cf foundation.tar -T -
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to ghcr.io
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push to branch
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          file: .github/dockerfiles/foundation-saw.Dockerfile
          tags: ghcr.io/nationalsecurityagency/foundation/foundation-saw:${{ inputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

  build-foundation-container:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nationalsecurityagency/foundation/cargo:latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Build release Rust for Cryptol FFIs
        run: .ci/build-rust-ffi.sh
      - name: Tar all `.cry` and `.so` files
        run: find . -name "*.cry" -or -name "*.so" | tar -cf foundation.tar -T -
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to ghcr.io
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push to branch
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          file: .github/dockerfiles/foundation.Dockerfile
          tags: ghcr.io/nationalsecurityagency/foundation/foundation:${{ inputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
